version: "3.8"

services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    ports:
      - "8080:8080" # HTTP API
      - "9090:9090" # Metrics
      - "3478:3478/udp" # STUN
    volumes:
      - ./headscale/config:/etc/headscale
      - ./headscale/data:/var/lib/headscale
    command: headscale serve
    environment:
      - TZ=UTC

  # HeadFwd sidecar - establishes reverse tunnel
  headfwd-sidecar:
    build: ./headfwd-sidecar
    container_name: headfwd-sidecar
    restart: unless-stopped
    environment:
      # Set these after registering with proxy
      - TUNNEL_URL=${TUNNEL_URL:-}
      - HEADSCALE_URL=http://headscale:8080
    depends_on:
      - headscale
    # Comment out until you have TUNNEL_URL
    profiles:
      - with-tunnel
